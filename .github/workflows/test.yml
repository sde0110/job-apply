name: test

on:
  push:
    branches: [main]
  pull_request:

# 기본 토큰은 읽기 전용. 이 워크플로는 저장소에 아무것도 쓰지 않는다.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # 액션은 태그가 아니라 커밋 SHA 로 고정한다 (Dependabot 이 갱신)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Linux 준비 (한글 대체 글꼴, Chrome 샌드박스)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
      - name: 의존성
        run: python -m pip install -r requirements.txt
      - name: 의존성 취약점 감사
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: 환경 점검
        run: python skills/job-apply/scripts/doctor.py || true
      - name: 테스트
        run: python -m unittest discover -s tests -v
